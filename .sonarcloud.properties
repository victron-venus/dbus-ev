# These files only provide user-overridable LAN configuration and examples.
# Plain HTTP remains supported for Home Assistant installations without local TLS.
# Reviewed python:S8707 false positives in the frozen shared release helpers.
# prepare_version.py writes validated version text as content to fixed pr-body.md;
# release_versioned.py writes manifest content to a fixed private stage destination.
# Neither content value selects the output path. Automatic Analysis supports exact
# file exclusions here, so retain analysis of the other release helpers.
sonar.exclusions=config.py,local_config.example.py,scripts/prepare_version.py,scripts/release_versioned.py
sonar.sourceEncoding=UTF-8

# Independently installed GX and HA components retain the pinned upstream mappings.
# Exclude their intentional copies and generated protobuf from duplication only;
# reliability and security analysis still includes these files.
sonar.cpd.exclusions=dbus_ev/mercedes/vendor/**,ha/custom_components/mbapi2020/car.py,ha/custom_components/mbapi2020/decoder.py,ha/custom_components/mbapi2020/helper.py
