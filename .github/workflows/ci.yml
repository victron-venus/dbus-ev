name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    # Reusable workflows must be called at the JOB level (no runs-on/steps);
    # a step-level `uses` of a workflow_call workflow is rejected by GitHub.
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@368320994ed55ae68935dcadb4062000a4648b92 # main
    with:
      use-uv-lock: true
      dependency-extras: "dev"
      build-dependency-group: build
      python-version: '3.12.13'
      # mypy has pre-existing errors (Venus OS imports without stubs); tracked separately
      run-type-check: false
      coverage-threshold: 60

  validate-secrets-template:
    name: Validate secrets template
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate local_config.example.py syntax
        run: python -m py_compile local_config.example.py
      - name: Check local_config.example.py has no real values
        run: |
          if grep -E '(token|password|secret|key)\s*=\s*["\x27][^"\x27]{8,}' local_config.example.py | grep -v 'your_'; then
            echo "ERROR: local_config.example.py may contain real values"
            exit 1
          fi
          echo "OK: local_config.example.py looks like a template"

    timeout-minutes: 30
  vehicle-engine:
    name: Experimental vehicle engine
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vehicle-engine/go.mod
          cache-dependency-path: vehicle-engine/go.sum
      - name: Test read-only engine and every catalog template without accounts
        run: python3 vehicle-engine/build.py test -race ./...
      - name: Vet engine
        run: python3 vehicle-engine/build.py vet ./...
      - name: Cross-compile for Cerbo GX
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
        run: sh scripts/build-vehicle-engine.sh /tmp/vehicle-engine-armv7
    timeout-minutes: 30

  tls-armv7:
    name: ARMv7 offline TLS dependency bundle
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and verify offline on ARMv7
        run: |
          docker buildx build --platform linux/arm/v7 \
            --file build-support/tls-armv7/Dockerfile \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --output type=local,dest=release-dist/tls-armv7 --progress plain .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tls-dependencies-cp312-armv7
          path: release-dist/tls-armv7/
          if-no-files-found: error
